experience has grown into a passion for helping students prepare with clarity and confidence.","mentorMore":"More about Mohammed","quote":"I don’t just teach PTE. I understand the challenges of learning it.","instructor":"PTE Instructor & Mentor","processEy":"How we work","processTitle":"Learn it. Try it. Make it better.","processIntro":"Consistent practice matters. So does knowing what to change before you practise again.","steps":["Learn","Practise","Get feedback","Analyse mistakes","Improve","Practise again"],"cta":"Let’s find your starting point.","ctaSub":"Tell us about your target score, your exam plans and the skills you want help with. We can talk through a suitable course.","coursePage":"Your target. Your learning plan.","coursePageIntro":"Five online programmes for different schedules and learning needs. All courses include mock testing and personalised performance analysis appropriate to the programme.","included":"Included in every programme","includedSub":"Mock practice is most useful when you understand the result. We review strengths, common mistakes and areas to improve, then recommend what to practise next.","includedItems":["PTE-style mock practice","Detailed performance review","Personalised next steps"],"what":"What you’ll get","ideal":"Ideal for","fees":"Course fees: contact us for details.","enquire":"Ask about this course","aboutEy":"Your instructor","aboutTitle":"Meet Mohammed Ismam.","aboutSub":"PTE Instructor & Mentor | Legal Professional | Passionate PTE Researcher","aboutSections":[["A learner first. A mentor next.","I am Mohammed Ismam, a PTE instructor and mentor with undergraduate and postgraduate studies under the United Kingdom’s education system. Alongside my academic background, I am a practising legal professional.","My PTE journey began in 2023. What started as a personal learning experience became a lasting interest in the examination and in helping others prepare. Over a period of one and a half years, I personally guided approximately 25 learners, helping them recognise their weaknesses and approach the test with greater confidence."],["Beyond one-size-fits-all coaching","I understand the frustration of repeated mistakes and the uncertainty of knowing which strategies to use. My approach starts by understanding each student’s difficulties and the reasons behind their mistakes.","Classes and strategies are part of preparation. Consistent practice, meaningful feedback and honest performance analysis are just as important. I help students understand what needs work and how to practise it."],["A shared commitment","At GlobalPath PTE, my team and I provide individual attention, constructive feedback and practical guidance. Students should feel comfortable asking questions and discussing the things they find difficult.","Learning continues after class. Progress comes from applying what you have learned, reviewing your performance and making steady improvements."],["Still learning. Still researching.","I continue to study PTE question types, preparation strategies, scoring principles and learning techniques. As the examination develops, I keep building my understanding so that my teaching remains relevant and practical."],["A message to future students","Your target score takes a clear preparation strategy, consistent practice, honest feedback and a willingness to improve. Every student’s journey is different. My goal is to help you understand your strengths, work through your weaknesses and prepare with a sense of direction.","Your goal matters to us, and your progress is our priority."]],"aboutSide":"What you can expect","aboutPoints":["Attention to your individual difficulties","Practical explanations and guided practice","Constructive performance feedback","Supportive, honest conversations"],"contactEy":"Let’s talk","contactTitle":"Start with a conversation.","contactIntro":"Not sure which course fits? Share your target score, preparation time and the skills you find difficult.","email":"Em র ফল বুঝতে পারলেই চর্চা আরও কাজে আসে। আপনার শক্তি, সাধারণ ভুল ও উন্নতির জায়গাগুলো পর্যালোচনা করে পরের চর্চার দিকনির্দেশনা দেব।","includedItems":["পিটিই ধরনের মক অনুশীলন","বিস্তারিত পারফরম্যান্স পর্যালোচনা","ব্যক্তিগত উন্নতির পরামর্শ"],"what":"যা পাবেন","ideal":"যাদের জন্য","fees":"কোর্স ফি: বিস্তারিত জানতে যোগাযোগ করুন।","enquire":"এই কোর্স সম্পর্কে জানুন","aboutEy":"আপনার প্রশিক্ষক","aboutTitle":"পরিচিত হোন Mohammed Ismam-এর সঙ্গে।","aboutSub":"পিটিই প্রশিক্ষক ও মেন্টর | আইন পেশাজীবী | পিটিই নিয়ে গবেষণায় আগ্রহী","aboutSections":[["আগে শিক্ষার্থী। তারপর মেন্টর।","আমি Mohammed Ismam, একজন পিটিই প্রশিক্ষক ও মেন্টর। যুক্তরাজ্যের শিক্ষাব্যবস্থার অধীনে স্নাতক ও স্নাতকোত্তর পর্যায়ে পড়াশোনা করেছি। পাশাপাশি আমি একজন আইন পেশাজীবী।","২০২৩ সালে আমার পিটিই যাত্রা শুরু। ব্যক্তিগত শেখার অভিজ্ঞতা থেকে পরীক্ষাটি নিয়ে জানার এবং অন্যদের প্রস্তুতিতে সাহায্য করার আগ্রহ তৈরি হয়। দেড় বছরের একটি সময়ে প্রায় ২৫ জন শিক্ষার্থীকে ব্যক্তিগতভাবে সহায়তা করেছি, যাতে তারা দুর্বলতা বুঝতে পারেন এবং আরও আত্মবিশ্বাস নিয়ে পরীক্ষার প্রস্তুতি নিতে পারেন।"],["সবার জন্য একই পদ্ধতি নয়","একই ভুল বারবার করা এবং কোন কৌশল কাজে লাগবে তা বুঝতে না পারার হতাশা আমি বুঝি। তাই প্রতিটি শিক্ষার্থীর অসুবিধা এবং ভুলের কারণ বোঝা থেকেই আমার শেখানোর শুরু।","ক্লাস ও কৌশল প্রস্তুতির অংশ। নিয়মিত চর্চা, অর্থপূর্ণ ফিডব্যাক এবং সৎ পারফরম্যান্স বিশ্লেষণও সমান জরুরি। কী নিয়ে কাজ করতে হবে এবং কীভাবে চর্চা করবেন, সেটি বুঝতে সাহায্য করি।"],["একসঙ্গে এগিয়ে যাওয়ার অঙ্গীকার","GlobalPath PTE-তে আমরা ব্যক্তিগত মনোযোগ, গঠনমূলক ফিডব্যাক এবং ব্যবহারিক দিকনির্দেশনা দিতে চাই। শিক্ষার্থীরা যেন স্বচ্ছন্দে প্রশ্ন করতে পারেন এবং তাদের অসুবিধার কথা বলতে পারেন।","ক্লাসের পরও শেখা চলতে থাকে। শেখা বিষয় কাজে লাগানো, নিজের পারফরম্যান্স পর্যালোচনা করা এবং নিয়মিত উন্নতির চেষ্টা থেকেই অগ্রগতি আসে।"],["শেখা ও গবেষণা চলছে","পিটিই প্রশ্নের ধরন, প্রস্তুতির কৌশল, স্কোরিংয়ের নীতি এবং শেখার পদ্ধতি নিয়ে আমি নিয়মিত পড়াশোনা করি। পরীক্ষা পরিবর্তিত হওয়ার সঙ্গে নিজের বোঝাপড়াও বাড়াই, যাতে শিক্ষার্থীদের প্রাসঙ্গিক ও ব্যবহারিক সহায়তা দিতে পারি।"],["ভবিষ্যৎ শিক্ষার্থীদের জন্য let lang='en',observer;
const routes=['home','courses','about','contact'];
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const button=(label,href,secondary=false)=>`<a class="btn${secondary?' secondary':''}" href="${href}">${label}</a>`;
const intro=(eye,title,desc)=>`<div class="wrap"><div class="page-intro"><div class="eyebrow">${eye}</div><h1>${title}</h1><p>${desc}</p></div></div>`;
const cta=t=>`<section class="section wrap"><div class="cta reveal"><div><h2>${t.cta}</h2><p>${t.ctaSub}</p></div>${button(t.contact,'#contact')}</div></section>`;
function courseCards(t){return COURSES.slice(0,3).map(c=>{const x=c[lang];return `<article class="card course-card reveal"><span class="pill">${x.label}</span><h3>${c.name}</h3><p>${x.desc}</p><div class="course-meta">${icon('clock')}<span>${x.meta}</span></div><a class="text-link" href="#courses/${c.slug}">${t.details}</a></article>`}).join('')}
function home(t){return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">${t.eyebrow}</div><h1>${t.hero}</h1><p class="lead">${t.intro}</p><div class="actions">${button(t.contact,'#contact')}${button(t.view,'#courses',true)}</div><div class="trust"><span>${icon('screen')}${t.online}</span><span>${icon('check')}${t.personal}</span></div></div><div class="study-board"><div class="board-top"><span>${t.board}</span><span class="board-label">${t.live}</span></div><h2 class="board-title">${t.boardTitle}</h2><div class="skills">${['mic','pen','book','headphones'].map((ic,i)=>`<div class="skill"><div class="ico">${icon(ic)}</div><div><strong>${t.skills[i]}</strong><small>${t.skillNotes[i]}</small></div></div>`).join('')}</div><div class="board-note">${icon('chart')}<div><strong>${t.mock}</strong><small>${t.mockSub}</small></div></div><div class="floating"><strong>${t.floating}</strong><span>${t.floatSub}</span></div></div></div></section><div class="strip"><div class="wrap">${t.strip.map((x,i)=>`<span>${icon(['clock','user','chart'][i])}${x}</span>`).join('')}</div></div><section class="section wrap"><div class="section-head reveal"><div><div class="eyebrow">${t.whyEy}</div><h2>${t.why}</h2></div><p>${t.whySub}</p></div><div class="grid3">${t.benefits.map((b,i)=>`<article class="card reveal"><div class="ico">${icon(['book','chart','chat'][i])}</div><h3>${b[0]}</h3><p>${b[1]}</p></article>`).join('')}</div></section><section class="section tint"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">${t.courseEy}</div><h2>${t.courseTitle}</h2><p>${t.courseIntro}</p></div><a class="text-link" href="#courses">${t.allCourses}</a></div><div class="grid3">${courseCards(t)}</div></div></section><section class="section wrap"><div class="mentor"><div class="quote reveal"><div class="quote-mark">“</div><blockquote>${t.quote}</blockquote><strong>Mohammed Ismam</strong><div class="small">${t.instructor}</div></div><div class="reveal"><div class="eyebrow">${t.mentorEy}</div><h2>${t.mentorTitle}</h2><p>${t.mentorIntro}</p><div class="actions"><a class="text-link" href="#about">${t.mentorMore}</a></div></div></div></section><section class="section tint"><div class="wrap reveal"><div class="eyebrow">${t.processEy}</div><h2>${t.processTitle}</h2><p class="lead">${t.processIntro}</p><div class="steps">${t.steps.map((s,i)=>`<div class="step"><div class="ico">${icon(['book','pen','chat','chart','check','clock'][i])}</div><span>${s}</span></div>`).join('')}</div></div></section>${cta(t)}`}
function courses(t){return `${intro(t.courseEy,t.coursePage,t.coursePageIntro)}<section class="section wrap" style="padding-top:10px"><div class="course-list">${COURSES.map(c=>{const x=c[lang];return `<article class="card course-full reveal" id="course-${c.slug}"><span class="pill">${x.label}</span><h2>${c.name}</h2><div class="course-meta">${icon('clock')}<span>${x.meta}</span></div><p>${x.desc}</p><h4>${t.what}</h4><ul>${x.items.map(i=>`<li>${i}</li>`).join('')}</ul><p class="ideal"><strong>${t.ideal}:</strong> ${x.ideal}</p><div class="fee">${t.fees}</div>${button(t.enquire,'#contact')}</article>`}).join('')}</div></section><section class="section tint"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">${t.mock}</div><h2>${t.included}</h2></div><p>${t.includedSub}</p></div><div class="grid3">${t.includedItems.map((s,i)=>`<div class="card reveal"><div class="ico">${icon(['screen','chart','user'][i])}</div><h3>${s}</h3></div>`).join('')}</div></div></section>${cta(t)}`}
function about(t){return `${intro(t.aboutEy,t.aboutTitle,t.aboutSub)}<section class="section wrap" style="padding-top:15px"><div class="about-layout"><div class="prose">${t.aboutSections.map(s=>`<section class="reveal"><h2>${s[0]}</h2>${s.slice(1).map(p=>`<p>${p}</p>`).join('')}</section>`).join('')}</div><aside class="aside-card"><div class="ico">${icon('user')}</div><h3>${t.aboutSide}</h3><ul>${t.aboutPoints.map(p=>`<li>${p}</li>`).join('')}</ul><p>${t.quote}</p><div class="actions">${button(t.contact,'#contact')}</div></aside></div></section><section class="section tint"><div class="wrap"><div class="eyebrow">${t.processEy}</div><h2>${t.processTitle}</h2><div class="steps">${t.steps.map((s,i)=>`<div class="step"><div class="ico">${icon(['book','pen','chat','chart','check','clock'][i])}</div><span>${s}</span></div>`).join('')}</div></div></section>${cta(t)}`}
function contact(t){const fb=CONTACT.messenger||CONTACT.facebook;return `${intro(t.contactEy,t.contactTitle,t.contactIntro)}<section class="section wrap" style="padding-top:15px"><div class="contact-grid"><div class="contact-options"><a class="contact-option" href="mailto:${CONTACT.email}"><div class="ico">${icon('mail')}</div><div><strong>${t.email}</strong><span>${CONTACT.email}</span></div></a><a class="contact-option" href="${fb}" target="_blank" rel="noopener noreferrer"><div class="ico">${icon('chat')}</div><div><strong>${t.facebook}</strong><span>${t.fbNote}</span></div></a>${CONTACT.whatsapp?`<a class="contact-option" href="https://wa.me/${CONTACT.whatsapp}" target="_blank" rel="noopener noreferrer"><div class="ico">${icon('chat')}</div><div><strong>${t.wa}</strong><span>+${CONTACT.whatsapp}</span></div></a>`:`<div class="contact-option disabled" aria-disabled="true"><div class="ico">${icon('chat')}</div><div><strong>${t.wa}</strong><span>${t.soon}</span></div></div>`}</div><aside class="aside-card"><h3>${t.contactAside}</h3><p>${t.contactAsideText}</p><p class="small">${t.online}</p></aside></div><div style="max-width:780px;margin-top:55px"><h2 style="font-size:1.9rem">${t.faqTitle}</h2>${t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></section>`}
function render(keepScroll=false){const t=COPY[lang];const bits=location.hash.slice(1).split('/');let route=bits[0]||'home';if(!routes.includes(route))route='home';const active=route;document.documentElement.lang=lang;document.body.setAttribute('lang',lang);const navigation=routes.map((r,i)=>`<a href="#${r}" ${r===active?'class="active" aria-current="page"':''}>${t.nav[i]}</a>`).join('');document.querySelector('.nav').innerHTML=navigation;document.querySelector('.drawer nav').innerHTML=navigation;document.querySelector('.drawer-note').textContent=t.tag;document.querySelector('.skip').textContent=t.skip;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));const main=document.querySelector('main');main.innerHTML=({home,courses,about,contact}[route])(t);main.className='page-enter';document.title=`${t.nav[routes.indexOf(route)]} | GlobalPath PTE`;document.querySelector('#footer').innerHTML=`<div class="wrap"><div class="footer-grid"><div><a href="#home"><img src="${LOGO}" loading="lazy" decoding="async" alt="GlobalPath PTE" width="143" height="90"></a><p>${t.tag}</p><p>${t.footerText}</p></div><div><h4>${t.quick}</h4>${routes.map((r,i)=>`<a href="#${r}">${t.nav[i]}</a>`).join('')}</div><div><h4>${t.getInTouch}</h4><a href="mailto:${CONTACT.email}">${CONTACT.email}</a><a href="${CONTACT.messenger||CONTACT.facebook}" target="_blank" rel="noopener noreferrer">${t.facebook}</a><p>${t.online}</p></div></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} GlobalPath PTE. ${t.rights}</span><span>${t.independent}</span></div></div>`;if(observer)observer.disconnect();if('IntersectionObserver'in window){observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');observer.unobserve(e.target)}}),{threshold:.08});main.querySelectorAll('.reveal').forEach(e=>observer.observe(e))}else main.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});if(route==='courses'&&bits[1])requestAnimationFrame(()=>document.getElementById('course-'+bits[1])?.scrollIntoView({behavior:'instant',block:'start'}));document.querySelector('#status').textContent=t.nav[routes.indexOf(route)];}
function menu(open){document.body.classList.toggle('menu-open',open);document.getElementById('menuButton').setAttribute('aria-expanded',open);document.getElementById('drawer').inert=!open;document.querySelector('main').inert=open;document.querySelector('header').inert=open;document.querySelector('footer').inert=open;if(open)document.getElementById('closeMenu').focus();else document.getElementById('menuButton').focus()}
// Exact rising two-note sounds from the supplied Sonic Arcade engine.
const SOUND_CATALOG=[{id:'toggle-on',kind:'up',f:550},{id:'checkbox-check',kind:'up',f:1100}];
const SoundFX=(()=>{let ctx,master;async function play(id){try{const s=SOUND_CATALOG.find(x=>x.id===id);if(!s)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.32;master.connect(ctx.destination);}if(ctx.state==='suspended')await ctx.resume();if(ctx.state!=='running')return;const t=ctx.currentTime+.015;[1,1.5].forEach((r,i)=>{const offset=i*.08,len=.13,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(s.f*r,t+offset);g.gain.setValueAtTime(.0001,t+offset);g.gain.exponentialRampToValueAtTime(.35,t+offset+.008);g.gain.exponentialRampToValueAtTime(.0001,t+offset+len);o.connect(g);if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=0;g.connect(p);p.connect(master);}else g.connect(master);o.start(t+offset);o.stop(t+offset+len+.02);});}catch(e){}}return{play};})();
document.documentElement.classList.add('js');document.getElementById('menuButton').onclick=()=>menu(true);document.getElementById('closeMenu').onclick=()=>menu(false);document.getElementById('veil').onclick=()=>menu(false);document.addEventListener('keydown',e=>{if(!document.body.classList.contains('menu-open'))return;if(e.key==='Escape'){menu(false);return}if(e.key==='Tab'){const f=[...document.querySelectorAll('.drawer a,.drawer button')];const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('click',e=>{const interactive=e.target.closest('a,button,summary');if(interactive){if(interactive.matches('.nav a,.drawer nav a'))SoundFX.play('toggle-on');else SoundFX.play('checkbox-check');}const b=e.target.closest('[data-lang]');if(b){lang=b.dataset.lang;render(true);return}const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')!=='#main'){if(document.body.classList.contains('menu-open'))menu(false);if(a.hash===location.hash)render();}});window.addEventListener('hashchange',()=>{render();document.querySelector('main').focus({preventScroll:true})});window.addEventListener('resize',()=>{if(window.innerWidth>780&&document.body.classList.contains('menu-open'))menu(false)});render();
